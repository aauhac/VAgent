services:
  postgres:
    image: postgres:16-alpine
    container_name: vagent-postgres-dev
    environment:
      POSTGRES_USER: vagent
      POSTGRES_PASSWORD: vagent
      POSTGRES_DB: vagent
    ports:
      - "5433:5432"
    volumes:
      - vagent_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vagent -d vagent"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vagent_pg_data:
