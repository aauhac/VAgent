<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Home fixture</title>
  <link rel="stylesheet" href="file:///C:/VocalAgent/miniapp/src/styles/app.css" />
</head>
<body>
  <div class="app-shell">
    <main>
      <section class="home-hero">
        <p class="page-kicker">보컬 분석</p>
        <h1 class="brand">내 목소리는 지금<br />어떻게 쓰이고 있을까?</h1>
        <p class="lead home-hero-lead">노래 한 구절로<br />발성 타입과 두드러진 특징을 확인해보세요.</p>
      </section>
      <section class="home-input">
        <div class="segmented">
          <button type="button" class="is-active">녹음하기</button>
          <button type="button">파일 업로드</button>
        </div>
        <div class="home-input-body">
          <p class="home-panel-desc">15~60초 한 구절이면 충분해요.</p>
          <button type="button" class="btn" style="width:100%">녹음 시작</button>
        </div>
      </section>
      <section class="home-compare">
        <h2 class="section-title">분석 단계</h2>
        <div class="compare-rows">
          <div class="compare-row">
            <h3 class="compare-title">무료 보컬 리포트</h3>
            <p class="compare-body">발성 타입 · 핵심 특징 · 현재 발성 상태</p>
          </div>
          <div class="compare-row">
            <h3 class="compare-title">상세 리포트</h3>
            <p class="compare-body">고음·음색 심층 분석 · 주요 구간 듣기 · 연습 목표 설정</p>
          </div>
          <div class="compare-row">
            <h3 class="compare-title">정밀 발성 진단</h3>
            <p class="compare-body">추가 녹음 · 정밀 확인 · 우선 연습 부분 · 단계별 피드백</p>
          </div>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
